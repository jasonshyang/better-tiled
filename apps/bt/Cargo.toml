[package]
name = "bt"
description = "bt: Tiled maps for agents and scripts on the command line, alone or with the running editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "bt"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# A map's AutoMap layers, read back from its project file when it is loaded.
bt-automap.workspace = true
bt-core.workspace = true
# The pictures bt writes (bt render, bt catalog --sheet), encoded as PNG.
bt-image.workspace = true
# The live link: maps open in the running editor.
bt-live.workspace = true
# A map's AutoMap record in better-tiled.json, kept and put back by bt edit and bt undo.
bt-project.workspace = true
bt-script.workspace = true
bt-tmx.workspace = true
bt-utils.workspace = true
clap = { workspace = true, features = ["derive"] }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
bt-test-data = { workspace = true, features = ["fixtures"] }

[lints]
workspace = true
