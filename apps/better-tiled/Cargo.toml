[package]
name = "better-tiled"
description = "The better-tiled window: tabs, the map canvas, panels and dialogs over bt-editor and bt-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bt-automap.workspace = true
bt-core.workspace = true
bt-editor.workspace = true
bt-image.workspace = true
bt-live.workspace = true
bt-render.workspace = true
bt-script.workspace = true
bt-terrain.workspace = true
bt-tmx.workspace = true
bt-utils.workspace = true
eframe = { workspace = true, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
egui.workspace = true
env_logger.workspace = true
glam.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
pollster.workspace = true
rfd.workspace = true
serde_json.workspace = true

# The quit guard: the application's delegate is asked before the system quits it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder"] }

[dev-dependencies]
bt-test-data = { workspace = true, features = ["fixtures"] }
egui_kittest = { workspace = true, features = ["eframe"] }
fontdue.workspace = true
toml.workspace = true

# The workspace's lints, but `unsafe_code` is denied where the workspace forbids it: the macOS
# quit guard allows it in one function (src/platform/quit.rs, docs/decisions.md). A test there
# keeps this table the workspace's otherwise.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
