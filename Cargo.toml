[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jason Yang"]

[workspace.dependencies]
# Our crates.
bt-core = { path = "crates/bt-core" }
bt-image = { path = "crates/bt-image" }
bt-test-data = { path = "crates/bt-test-data" }
bt-tmx = { path = "crates/bt-tmx" }
bt-utils = { path = "crates/bt-utils" }

# Others, pinned here so every crate takes the same version and only the features it uses.
base64 = "0.23"
bitflags = "2.13"
flate2 = "1.1"
glam = "0.33"
image = { version = "0.25", default-features = false }
regex = "1.13"
roxmltree = "0.21"
ruzstd = "0.9"
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The engineering rules of docs/design/00-high-level-design.md §2.2 that a lint can hold:
# no unwrap or expect, no indexing that could panic, no panics of any other kind, no printing
# from libraries. clippy.toml lets tests do all of these.
[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Smoothness matters even while developing: dependencies are optimised in dev and test builds,
# and our own code one level, which keeps debug checks on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
