[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Jason Yang"]

[workspace.dependencies]
# Our crates.
bt-core = { path = "crates/bt-core" }
bt-edit = { path = "crates/bt-edit" }
bt-editor = { path = "crates/bt-editor" }
bt-image = { path = "crates/bt-image" }
bt-render = { path = "crates/bt-render" }
bt-terrain = { path = "crates/bt-terrain" }
bt-test-data = { path = "crates/bt-test-data" }
bt-tmx = { path = "crates/bt-tmx" }
bt-utils = { path = "crates/bt-utils" }

# Others, pinned here so every crate takes the same version and only the features it uses.
base64 = "0.23"
bitflags = "2.13"
bytemuck = { version = "1.25", features = ["derive"] }
# The window: eframe, egui and egui-wgpu move together, and wgpu is the version egui-wgpu uses.
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui_kittest = "0.36.2"
env_logger = "0.11"
# The font of the renderer's text: egui's own, so canvas text matches the panels.
epaint_default_fonts = "0.36.2"
flate2 = "1.1"
fontdue = "0.9"
glam = "0.33"
image = { version = "0.25", default-features = false }
log = "0.4"
# The macOS quit guard (apps/better-tiled): the versions winit already uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
pollster = "0.4"
regex = "1.13"
rfd = "0.17"
roxmltree = "0.21"
# The user id that names the runtime folder (bt-utils, Unix only): no unsafe code of ours.
rustix = { version = "1.1", default-features = false, features = ["process"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
toml = "1.1"
wgpu = "30.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The engineering rules of docs/design/00-high-level-design.md §2.2 that a lint can hold:
# no unwrap or expect, no indexing that could panic, no panics of any other kind, no printing
# from libraries. clippy.toml lets tests do all of these.
[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Smoothness matters even while developing: dependencies are optimised in dev and test builds,
# and our own code one level, which keeps debug checks on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
